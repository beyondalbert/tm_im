// ============================================================
// tm_im 长连接协议定义
// ------------------------------------------------------------
// 用途：任何语言都可直接用本文件生成代码接入，无需依赖官方 SDK
//
// 编译示例：
//   protoc --java_out=./out                 proto/transport.proto
//   protoc --python_out=./out               proto/transport.proto
//   protoc --go_out=./out --go_opt=paths=source_relative proto/transport.proto
//   protoc --ts_out=./out                   proto/transport.proto
//
// 传输载体：
//   WebSocket : 一个 WS 二进制消息 = 一个完整 Frame（无需额外长度前缀）
//   原生 TCP  : 4 字节大端长度前缀 + Frame 字节流
// ============================================================

syntax = "proto3";

package tm.im.transport;

option java_package        = "com.tm.im.proto.transport";
option java_multiple_files = true;
option java_outer_classname = "TransportProto";

// ------------------------------------------------------------
// 顶层帧：所有通信的最小单元
// ------------------------------------------------------------
message Frame {
  Cmd    cmd     = 1;  // 命令字，决定 payload 的具体类型
  uint64 req_id  = 2;  // 请求序号（客户端自增），用于请求-响应关联；服务端主动推送时为 0
  bytes  payload = 3;  // 按 cmd 对应的消息序列化后的字节

  // ----------------------------------------------------------
  // 命令字。
  //
  // 三条不变量（完整说明见接入文档 04-realtime.md §2.3，
  // tools/verify_integration_docs.py 的第 5 节逐条机器校验）：
  //   1. 一个命令字只属于一个方向：C→S、S→C、双向，或 -（保留值，不用于任何方向）。
  //      「请求与响应共用同一个命令字」会让接收方无法判断手里这帧是什么——
  //      CMD_SYNC 曾经就是这样，修正见下方 CMD_SYNC_RESP。
  //   2. 一个命令字只对应一种载荷类型，且一种载荷类型只挂在一个命令字上。
  //      payload 是 bytes，类型信息完全由 cmd 决定，没有第二条线索。
  //   3. 编号只增不改：一旦出现在对外文档里，这个值的含义就不再变。
  //
  // 每行的格式是机器可解析的，必须严格保持（方向 ∈ {C→S, S→C, 双向, -}）：
  //   CMD_XXX = <编号>; // <方向> payload = <消息名|-> <说明>
  // ----------------------------------------------------------
  enum Cmd {
    // ---- 握手与保活 ----
    CMD_UNKNOWN = 0;     // -    payload = -             保留值，任何一方都不得使用
    CMD_AUTH    = 1;     // C→S  payload = AuthRequest   鉴权请求（必须是第一帧）
    CMD_AUTH_OK = 2;     // S→C  payload = AuthResponse  鉴权成功
    CMD_PING    = 3;     // 双向 payload = -             心跳
    CMD_PONG    = 4;     // 双向 payload = -             心跳应答

    // ---- 消息 ----
    CMD_SEND      = 10;  // C→S  payload = SendRequest   发送消息
    CMD_SEND_ACK  = 11;  // S→C  payload = SendAck       发送成功回执（含最终 seq）
    CMD_PUSH      = 12;  // S→C  payload = PushMessage   新消息推送
    CMD_READ      = 13;  // C→S  payload = ReadRequest   已读上报
    CMD_SYNC      = 14;  // C→S  payload = SyncRequest   断点续传拉取
    CMD_SYNC_END  = 15;  // S→C  payload = SyncEnd       续传整轮结束（仅在一次 CMD_SYNC 已全部补齐时发一次）
    CMD_SYNC_RESP = 16;  // S→C  payload = SyncResponse  续传响应（一次 CMD_SYNC 恰好对应一帧）

    // ---- 控制 ----
    CMD_KICK  = 20;      // S→C  payload = KickNotice   强制下线
    CMD_ERROR = 21;      // S→C  payload = ErrorFrame   错误（对应 req_id）
  }
}

// ------------------------------------------------------------
// 枚举：线上以数字为准，名称仅供可读性
// ------------------------------------------------------------
enum ActorType {
  ACTOR_TYPE_UNKNOWN = 0;
  ACTOR_TYPE_HUMAN   = 1;  // 人类
  ACTOR_TYPE_AGENT   = 2;  // Agent（与人同权）
}

enum MsgType {
  MSG_TYPE_UNKNOWN = 0;
  MSG_TYPE_TEXT    = 1;
  MSG_TYPE_IMAGE   = 2;
  MSG_TYPE_SYSTEM  = 3;
}

enum KickReason {
  KICK_REASON_UNKNOWN        = 0;
  KICK_REASON_OTHER_DEVICE   = 1;  // 其他端登录顶号
  KICK_REASON_SUSPENDED      = 2;  // 账号被停用
  KICK_REASON_SERVER_RESTART = 3;  // 服务重启，请重连
  KICK_REASON_AUTH_EXPIRED   = 4;  // 凭据过期，需重新认证
}

// ------------------------------------------------------------
// 握手与鉴权
// ------------------------------------------------------------
message AuthRequest {
  string token          = 1;  // HUMAN: JWT；AGENT: api_key
  string client_version = 2;  // 可选，便于服务端做兼容
  string device_id      = 3;  // 可选，同一 Actor 多端标识
}

message AuthResponse {
  uint64    actor_id      = 1;
  string    handle        = 2;
  ActorType actor_type    = 3;
  uint32    heartbeat_sec = 4;  // 服务端建议的心跳间隔（秒）
}

// ------------------------------------------------------------
// 消息体
// ------------------------------------------------------------
message Message {
  uint64  message_id    = 1;  // 全局唯一（Snowflake）
  uint64  conv_id       = 2;  // 会话 ID
  uint64  seq           = 3;  // 会话内严格递增序号（排序/去重/续传的唯一依据）
  uint64  sender_id     = 4;  // 发送者 Actor ID
  MsgType msg_type      = 5;
  string  content_json  = 6;  // 内容以 JSON 字符串承载，便于跨语言与版本演进
  uint64  reply_to      = 7;  // 引用的 message_id，0 表示未引用
  int64   created_at_ms = 8;  // Unix 毫秒时间戳（仅供展示，排序请用 seq）
}

message SendRequest {
  uint64  conv_id       = 1;
  string  client_msg_id = 2;  // 幂等键：同一客户端重复提交同值只会落一条
  MsgType msg_type      = 3;
  string  content_json  = 4;
  uint64  reply_to      = 5;
}

message SendAck {
  uint64 conv_id       = 1;
  uint64 seq           = 2;   // 服务端分配的最终序号（客户端应以它为准）
  uint64 message_id    = 3;
  int64  created_at_ms = 4;
  string client_msg_id = 5;   // 原样回传，便于客户端配对
}

message PushMessage {
  Message message = 1;
}

message ReadRequest {
  uint64 conv_id       = 1;
  uint64 last_read_seq = 2;  // 已读游标
}

// ------------------------------------------------------------
// 断点续传：重连后按会话逐个补齐丢失的 seq
// ------------------------------------------------------------
message ConvCursor {
  uint64 conv_id   = 1;
  uint64 since_seq = 2;  // 从「该 seq 之后」开始拉取（不含该 seq）
}

message SyncRequest {
  repeated ConvCursor cursors = 1;
  uint32 limit                = 2;  // 单会话单次返回上限，0 用服务端默认
}

// CMD_SYNC_RESP：一次 CMD_SYNC 恰好对应一帧，req_id 原样回传。
message SyncResponse {
  repeated Message messages = 1;  // 按 (conv_id, seq) 升序
  bool has_more             = 2;  // 为 true 时客户端应继续发送 SyncRequest（游标推进到本帧最后一条）
  bool truncated            = 3;  // 为 true 表示服务端截断（如超保留期），需走 REST 补拉
}

// CMD_SYNC_END：只在 SyncResponse.has_more == false 时紧随其后发一帧，req_id 与该请求相同。
// has_more == true 时不得发送它——否则客户端会在还没补齐的情况下认为已经追平。
message SyncEnd {
  bool   ok             = 1;
  string message        = 2;
  uint32 conv_synced    = 3;  // 本次 CMD_SYNC 中已补齐的会话数
}

// ------------------------------------------------------------
// 控制与错误
// ------------------------------------------------------------
message KickNotice {
  KickReason reason     = 1;
  string     detail     = 2;  // 人类可读的说明
  uint32     retry_after_ms = 3;  // 建议重连等待（毫秒），0 表示立即
}

message ErrorFrame {
  uint32 code      = 1;  // 见接入文档的错误码表
  string message   = 2;  // 人类可读
  bool   retryable = 3;  // 是否可安全重试（幂等前提下）
}
